name: CI

# Roda em todo push e em todo Pull Request.
# É o "on: pull_request" que faz o CI virar a status check exigida pelo portão
# (branch protection): sem ele, não dá pra bloquear o merge quando o teste falha.
on: [push, pull_request]

jobs:
  testes:
    runs-on: ubuntu-latest

    # Um Postgres de verdade, isolado, subido num CONTAINER só pra este job.
    # O GitHub cria e joga fora sozinho — os testes batem nele, não em banco compartilhado.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livraria
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # A API lê estas variáveis (src/db/dataSource.ts). Apontam pro Postgres do serviço.
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: livraria

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # synchronize:true cria o schema; os testes semeiam sozinhos (beforeEach).
      - run: npm test
