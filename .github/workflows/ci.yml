name: CI

# Roda em todo push e em todo Pull Request.
# O "on: pull_request" é o que faz o CI virar a status check exigida pelo portão
# (branch protection): sem ele, não dá pra bloquear o merge quando algo falha.
on: [push, pull_request]

jobs:
  testes:
    runs-on: ubuntu-latest

    # Um Postgres de verdade, num container só pra este job. O GitHub cria e
    # joga fora sozinho — os testes batem nele, não em banco compartilhado.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livraria
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # A app e os testes leem DATABASE_URL (lib/db.ts). Aponta pro Postgres do serviço.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/livraria

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Confere que o Next compila (type-check + build) — o que o deploy roda.
      - run: npm run build

      # Os testes criam o schema e semeiam sozinhos (beforeEach -> resetarBanco).
      - run: npm test
